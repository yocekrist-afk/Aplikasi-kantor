<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
    <!-- Faces backgrounds -->
    <polygon points="30,70 110,70 110,150 30,150" fill="#ffffff" />
    <polygon points="30,70 80,40 160,40 110,70" fill="#ffffff" />
    <polygon points="110,70 160,40 160,120 110,150" fill="#ffffff" />
    <polygon points="30,70 110,150 30,150" fill="#4A86E8" />
            <line x1="30" y1="70" x2="110" y2="150" stroke="#000000" stroke-width="1.5" /><line x1="30" y1="70" x2="160" y2="40" stroke="#000000" stroke-width="1.5" />
          <line x1="110" y1="70" x2="80" y2="40" stroke="#000000" stroke-width="1.5" /><circle cx="150" cy="110" r="4" fill="#4A86E8" stroke="#000000" stroke-width="1" />
    <!-- Cube Outlines -->
    <polygon points="30,70 110,70 110,150 30,150" fill="none" stroke="#000000" stroke-width="1.5" stroke-linejoin="round"/>
    <polygon points="30,70 80,40 160,40 110,70" fill="none" stroke="#000000" stroke-width="1.5" stroke-linejoin="round"/>
    <polygon points="110,70 160,40 160,120 110,150" fill="none" stroke="#000000" stroke-width="1.5" stroke-linejoin="round"/>
